<html>

    />
    <link
      rel="icon"
      type="image/png"

      href="./favicon/favicon-32x32.png"
    />

      rel="icon"

      <param name="bgcolor" value="#FFFFFF" />

        src="y1_soundtrack.swf"

        bgcolor="#FFFFFF"
        width="284"
        height="175"
        name="y1_soundtrack"
        ALIGN=""
